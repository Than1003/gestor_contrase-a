<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js" defer></script>
</head>
<body class="page-alt">
    <div class="form-shell">
        <div class="form-card">
            <div class="form-header">
                <span class="eyebrow">Editar registro</span>
                <h1>Actualizar cuenta</h1>
            </div>

            <div class="field-group">
                <label for="plataforma">Plataforma</label>
                <input type="text" id="plataforma" placeholder="Plataforma">
            </div>

            <div class="field-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Usuario">
            </div>

            <div class="field-group">
                <label for="clave">Contraseña</label>
                <input type="text" id="clave" placeholder="Contraseña">
            </div>

            <div class="button-row">
                <button class="btn btn-primary btn-lg" type="button" onclick="modificar(variable1)">
                    💾 Guardar cambios
                </button>
                <button class="btn btn-secondary btn-lg" type="button" onclick="location.href='index.html'">
                    ← Regresar
                </button>
            </div>
        </div>
    </div>

    <script>
        function getParameterByName(name) {
            name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
            var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
                results = regex.exec(location.search);
            return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
        }
        var variable1 = getParameterByName('variable1');
        consulta_individual(variable1);
    </script>
</body>
</html>

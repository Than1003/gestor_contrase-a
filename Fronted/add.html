<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js" defer></script>
</head>
<body class="page-alt">
    <div class="form-shell">
        <div class="form-card">
            <div class="form-header">
                <span class="eyebrow">Nuevo registro</span>
                <h1>Guardar contraseña</h1>
            </div>

            <div class="field-group">
                <label for="plataforma">Plataforma</label>
                <input type="text" id="plataforma" placeholder="Ej. Gmail, TikTok, GitHub">
            </div>

            <div class="field-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Tu usuario o correo">
            </div>

            <div class="field-group">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" placeholder="Escribe una contraseña segura">
            </div>

            <div class="button-row">
                <button class="btn btn-primary btn-lg" type="button" onclick="registrar()">
                    💾 Guardar
                </button>
                <button class="btn btn-secondary btn-lg" type="button" onclick="location.href='index.html'">
                    ← Regresar
                </button>
            </div>
        </div>
    </div>
</body>
</html>
